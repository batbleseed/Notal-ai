<!DOCTYPE html>
<html lang="en">
<head>

  <title>Notal AI • Chat</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --sidebar-width: 268px; --preview-width: 450px; --header-height: 54px;
      --bg: #ffffff; --bg2: #f2f2f2; --bg-sidebar: #f9f9f9; --bg-hover: #ececec;
      --text: #0d0d0d; --text2: #8e8ea0; --border: #ececec; --border-soft: #f0f0f0;
      --accent: #0d0d0d; --accent-hover: #2b2b2b; --accent-contrast: #ffffff;
      --bubble-user: #f4f4f4; --bubble-user-text: #0d0d0d; --radius: 0.85rem;
      --shadow: 0 2px 10px rgba(0,0,0,0.04);
      --composer-shadow: 0 4px 22px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.045);
      --cursor-color: #000;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .theme-dark {
      --bg: #212121; --bg2: #2a2a2a; --bg-sidebar: #181818; --bg-hover: #2f2f2f;
      --text: #ececec; --text2: #9b9b9b; --border: #313131; --border-soft: #2a2a2a;
      --accent: #ececec; --accent-hover: #d4d4d4; --accent-contrast: #171717;
      --bubble-user: #323232; --bubble-user-text: #ececec;
      --shadow: 0 2px 10px rgba(0,0,0,0.3);
      --composer-shadow: 0 4px 22px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
      --cursor-color: #fff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    .theme-dark ::-webkit-scrollbar-thumb { background: #4a4a4a; }
    .theme-dark ::-webkit-scrollbar-thumb:hover { background: #5c5c5c; }
    body {
      font-family: var(--font-sans);
      background: var(--bg); height: 100vh; width: 100vw; overflow: hidden;
      display: flex; color: var(--text); transition: background 0.25s, color 0.25s;
      font-size: 15px;
    }
    
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text2);
      font-size: 0.85rem;
    }
    .typing-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text2);
      animation: typingDot 1.4s infinite both;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    
    .thinking-toggle-btn {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 0.4rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
      margin-bottom: 0.3rem;
    }
    .thinking-toggle-btn:hover {
      background: var(--bg2);
      color: var(--text);
    }
    .thinking-toggle-btn.active {
      color: #f59e0b;
    }
    .thinking-content {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 0.5rem;
      padding: 0.6rem 0.8rem;
      margin: 0.3rem 0;
      font-size: 0.78rem;
      color: #92400e;
      line-height: 1.5;
      display: none;
      white-space: pre-wrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
      max-height: 300px;
      overflow-y: auto;
    }
    .thinking-content.visible { display: block; }
    .thinking-content.streaming {
      border-color: #fbbf24;
      background: #fffbeb;
    }
    
    .generated-image {
      max-width: 100%;
      border-radius: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid var(--border);
    }
    .image-loading {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
      color: var(--text2);
      font-size: 0.85rem;
    }
    .image-loading i {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .browser-iframe {
      width: 100%;
      height: 400px;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin: 0.5rem 0;
      background: #fff;
    }
    .browser-toolbar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.5rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 0.5rem 0.5rem 0 0;
    }
    .browser-toolbar input {
      flex: 1;
      border: none;
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 0.3rem;
      font-size: 0.75rem;
      color: var(--text);
    }
    .browser-toolbar button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text2);
      padding: 0.2rem 0.4rem;
      border-radius: 0.3rem;
    }
    .browser-toolbar button:hover {
      background: var(--border);
    }
    .browser-container {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    
    .ai-bubble h1, .ai-bubble h2, .ai-bubble h3 { font-size: 1.1em; font-weight: 700; margin: 0.8em 0 0.3em; }
    .ai-bubble h1 { font-size: 1.3em; }
    .ai-bubble p { margin: 0.4em 0; }
    .ai-bubble ul, .ai-bubble ol { margin: 0.5em 0; padding-left: 1.5em; }
    .ai-bubble li { margin: 0.2em 0; }
    .ai-bubble strong { font-weight: 700; }
    .ai-bubble em { font-style: italic; }
    .ai-bubble code { background: rgba(0,0,0,0.06); padding: 0.15em 0.4em; border-radius: 0.3em; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85em; }
    .ai-bubble pre { background: #1a1a1a; color: #e0e0e0; border-radius: 0.6rem; padding: 1rem; overflow-x: auto; margin: 0.5rem 0; font-size: 0.8rem; line-height: 1.5; position: relative; }
    .ai-bubble pre code { background: none; padding: 0; color: inherit; }
    .ai-bubble blockquote { border-left: 3px solid #ccc; padding-left: 0.8rem; margin: 0.5rem 0; color: var(--text2); }
    .ai-bubble table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; font-size: 0.85em; }
    .ai-bubble th, .ai-bubble td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
    .ai-bubble th { background: var(--bg2); font-weight: 600; }
    .ai-bubble a { color: #2563eb; text-decoration: underline; }
    .code-block-wrapper { position: relative; }
    .code-actions { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.3rem; z-index: 2; }
    .code-actions button { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #ccc; border-radius: 0.4rem; padding: 0.3rem 0.55rem; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 0.2rem; transition: all 0.2s; }
    .code-actions button:hover { background: rgba(255,255,255,0.25); color: #fff; }
    .code-actions button.copied { background: #22c55e; border-color: #22c55e; color: #fff; }
    .code-actions button.run-btn { background: #3b82f6; border-color: #3b82f6; }
    .model-select-trigger { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.65rem; background: transparent; border: none; border-radius: 0.6rem; cursor: pointer; font-size: 0.98rem; font-weight: 600; white-space: nowrap; color: var(--text); letter-spacing: -0.01em; }
    .model-select-trigger:hover { background: var(--bg-hover); }
    .model-select-trigger i.fa-robot { display: none; }
    .model-dropdown { position: absolute; top: calc(100% + 0.4rem); left: 0; bottom: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 0.9rem; box-shadow: 0 12px 34px rgba(0,0,0,0.14); min-width: 280px; max-height: 380px; overflow-y: auto; z-index: 30; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity 0.15s, transform 0.15s; padding: 0.35rem; }
    .model-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .model-dropdown-header { padding: 0.5rem 0.6rem 0.3rem; font-size: 0.65rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; }
    .model-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.65rem; cursor: pointer; font-size: 0.82rem; border-radius: 0.6rem; color: var(--text); }
    .model-option:hover { background: var(--bg-hover); }
    .model-option.selected { background: var(--bg2); font-weight: 600; }
    .sidebar { width: var(--sidebar-width); height: 100vh; background: var(--bg-sidebar); border-right: none; display: flex; flex-direction: column; flex-shrink: 0; transition: all 0.2s ease; z-index: 20; }
    .sidebar.closed { width: 0 !important; min-width: 0 !important; overflow: hidden; border-right: none; }
    .sidebar-header { padding: 0.6rem 0.6rem 0.3rem; display: flex; align-items: center; justify-content: space-between; min-width: 240px; }
    .sidebar-logo { display: flex; align-items: center; gap: 0.55rem; font-weight: 600; font-size: 0.92rem; padding: 0.35rem 0.5rem; letter-spacing: -0.01em; }
    .sidebar-logo-icon { width: 1.6rem; height: 1.6rem; background: var(--accent); color: var(--accent-contrast); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
    .close-sidebar-btn { background: none; border: none; cursor: pointer; padding: 0.45rem; border-radius: 0.5rem; color: var(--text2); font-size: 0.9rem; display: flex; }
    .close-sidebar-btn:hover { background: var(--bg-hover); }
    .new-chat-btn { width: calc(100% - 1.2rem); margin: 0.3rem 0.6rem 0.6rem; padding: 0.55rem 0.65rem; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 0.7rem; font-size: 0.83rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 0.55rem; justify-content: flex-start; }
    .new-chat-btn:hover { background: var(--bg-hover); }
    .new-chat-btn i { font-size: 0.8rem; color: var(--text2); }
    .chat-history { flex: 1; overflow-y: auto; padding: 0.2rem 0.6rem; min-width: 240px; }
    .chat-history-label { font-size: 0.68rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; padding: 0.5rem 0.6rem 0.35rem; }
    .history-item { padding: 0.5rem 0.65rem; border-radius: 0.6rem; cursor: pointer; font-size: 0.82rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.05rem; color: var(--text); }
    .history-item:hover { background: var(--bg-hover); }
    .history-item.active { background: var(--bg-hover); font-weight: 500; }
    .history-item-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item-actions { display: flex; gap: 0.15rem; opacity: 0; }
    .history-item:hover .history-item-actions { opacity: 1; }
    .history-action-btn { background: none; border: none; cursor: pointer; padding: 0.25rem; font-size: 0.68rem; color: var(--text2); border-radius: 0.35rem; }
    .history-action-btn:hover { color: #ef4444; }
    .sidebar-footer { padding: 0.5rem 0.6rem; border-top: 1px solid var(--border-soft); display: flex; align-items: center; gap: 0.4rem; min-width: 240px; }
    .sidebar-user { display: flex; align-items: center; gap: 0.5rem; flex: 1; cursor: pointer; padding: 0.35rem 0.5rem; border-radius: 0.7rem; min-width: 0; position: relative; }
    .sidebar-user:hover { background: var(--bg-hover); }
    .sidebar-user img { width: 1.7rem; height: 1.7rem; border-radius: 50%; object-fit: cover; }
    .sidebar-user-name { font-size: 0.78rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .signout-dropdown { position: absolute; bottom: 100%; left: 0; right: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 0.7rem; box-shadow: 0 8px 26px rgba(0,0,0,0.14); padding: 0.3rem; display: none; z-index: 30; margin-bottom: 0.3rem; }
    .signout-dropdown.show { display: block; }
    .signout-btn { width: 100%; padding: 0.5rem 0.6rem; border: none; background: none; cursor: pointer; text-align: left; font-size: 0.8rem; color: #ef4444; border-radius: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .signout-btn:hover { background: #fef2f2; }
    .google-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.6rem; background: transparent; border: 1px solid var(--border); border-radius: 0.7rem; cursor: pointer; font-size: 0.78rem; font-weight: 500; flex: 1; justify-content: center; color: var(--text); }
    .google-btn:hover { background: var(--bg-hover); }
    .google-btn img { width: 0.9rem; height: 0.9rem; }
    .settings-btn-circle { width: 2.1rem; height: 2.1rem; border-radius: 50%; background: transparent; color: var(--text2); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
    .settings-btn-circle:hover { background: var(--bg-hover); color: var(--text); }
    .toggle-sidebar-btn { position: fixed; top: 0.75rem; left: 0.75rem; transform: none; background: var(--bg); color: var(--text2); border: 1px solid var(--border); border-radius: 0.6rem; padding: 0.5rem 0.6rem; cursor: pointer; z-index: 25; display: none; font-size: 0.8rem; box-shadow: var(--shadow); }
    .toggle-sidebar-btn:hover { color: var(--text); background: var(--bg-hover); }
    .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; position: relative; }
    .chat-header { height: var(--header-height); padding: 0 0.85rem; display: flex; align-items: center; justify-content: space-between; border-bottom: none; position: relative; z-index: 12; background: var(--bg); }
    .brand { display: flex; align-items: center; gap: 0.4rem; }
    .mobile-menu-btn { display: none; background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--text); padding: 0.45rem; border-radius: 0.5rem; }
    .mobile-menu-btn:hover { background: var(--bg-hover); }
    .header-right { display: flex; align-items: center; gap: 0.6rem; margin-left: auto; }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
    .connection-dot.connected { background: #22c55e; }
    .messages-container { flex: 1; overflow-y: auto; padding: 1.25rem 1rem 0.5rem; display: flex; flex-direction: column; gap: 1.4rem; align-items: center; }
    .message-row { display: flex; gap: 0.85rem; animation: fadeIn 0.25s ease; width: 100%; max-width: 48rem; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .user-row { justify-content: flex-end; }
    .message-content { max-width: 100%; min-width: 0; }
    .user-row .message-content { max-width: 82%; }
    .message-bubble { line-height: 1.7; font-size: 0.95rem; word-wrap: break-word; }
    .ai-bubble { background: transparent; color: var(--text); border: none; border-radius: 0; padding: 0.15rem 0; }
    .user-bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-radius: 1.3rem; padding: 0.65rem 1.05rem; }
    .message-avatar { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; overflow: hidden; margin-top: 0.1rem; }
    .ai-avatar { background: var(--accent); color: var(--accent-contrast); }
    .user-row .message-avatar { display: none; }
    .upload-preview { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; justify-content: flex-end; }
    .upload-preview img { max-width: 100px; max-height: 70px; border-radius: 0.6rem; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
    .upload-preview .file-tag { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.3rem 0.6rem; background: var(--bg2); border: 1px solid var(--border); border-radius: 1rem; font-size: 0.72rem; }
    .input-container { padding: 0.5rem 1rem 1.1rem; display: flex; justify-content: center; }
    .input-wrapper { display: flex; flex-direction: column; align-items: stretch; gap: 0.1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 1.6rem; padding: 0.6rem 0.65rem 0.5rem 0.9rem; box-shadow: var(--composer-shadow); width: 100%; max-width: 48rem; transition: box-shadow 0.15s; }
    .input-wrapper:focus-within { box-shadow: var(--composer-shadow), 0 0 0 2px rgba(13,13,13,0.06); }
    .theme-dark .input-wrapper:focus-within { box-shadow: var(--composer-shadow), 0 0 0 2px rgba(255,255,255,0.08); }
    .input-row-top { display: flex; align-items: flex-end; gap: 0.5rem; }
    #userInput { flex: 1; border: none; background: transparent; padding: 0.35rem 0; font-size: 0.95rem; outline: none; color: var(--text); max-height: 9rem; resize: none; font-family: inherit; line-height: 1.5; overflow-y: auto; }
    #userInput::placeholder { color: var(--text2); }
    .input-row-bottom { display: flex; align-items: center; justify-content: space-between; padding-top: 0.15rem; }
    .upload-btn, .send-btn, .stop-btn { width: 2.05rem; height: 2.05rem; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
    .upload-btn { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .upload-btn:hover { background: var(--bg-hover); color: var(--text); }
    .send-btn { background: var(--accent); color: var(--accent-contrast); }

    .stop-btn.visible { display: flex; }
    .stop-btn i { font-size: 0.65rem; }
    .composer-hint { text-align: center; font-size: 0.7rem; color: var(--text2); margin-top: 0.55rem; }
    .landing-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; width: 100%; }

    .suggestion-card .s-icon { font-size: 0.9rem; }
    .suggestion-card .s-title { font-weight: 500; font-size: 0.82rem; }

    .preview-panel.visible { display: flex; }
    .preview-toolbar { padding: 0.5rem 0.75rem; background: #f9fafb; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem; }

    .preview-toolbar button:hover { background: #eee; }
    .preview-frame { flex: 1; border: none; background: #fff; }

    .settings-card { background: var(--bg); border-radius: 1rem; padding: 1.25rem; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); }

      function renderMarkdown(text) {
        let html = text;
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<div class="code-block-wrapper"><pre><code>${escapeHtml(code.trim())}</code></pre></div>`);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
        html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
        html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        html = html.replace(/\n/g, '<br>');
        return html;
      }

      function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        keys = JSON.parse(localStorage.getItem('notal_keys') || '{}');

        currentTheme = localStorage.getItem('notal_theme') || 'default';
        visitCount = parseInt(localStorage.getItem('notal_visit_count') || '0'); visitCount++;

        googleUser = JSON.parse(localStorage.getItem('notal_google_user') || 'null');

        $('systemPromptToggle').checked = systemPromptEnabled;

        else if (chats.length > 0) { loadChat(chats[0].id); isLanding = false; }

        localStorage.setItem('notal_system_prompt', systemPromptEnabled);

      async function generateImage(prompt) {
        const providerKey = keys[currentModel.provider];
        if (!providerKey) throw new Error('No API key for ' + currentModel.provider);
        
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: currentModel.provider,
            model: currentModel.id,
            prompt: prompt,
            isImageGen: true,
            apiKey: providerKey
          })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Image generation failed');
        return data.imageUrl;

      function createMiniBrowser(url) {
        const container = document.createElement('div');
        container.className = 'browser-container';
        container.innerHTML = `
          <div class="browser-toolbar">
            <button class="browser-back"><i class="fas fa-arrow-left"></i></button>
            <button class="browser-forward"><i class="fas fa-arrow-right"></i></button>
            <button class="browser-refresh"><i class="fas fa-redo"></i></button>
            <input class="browser-url" value="${escapeHtml(url)}" placeholder="Enter URL...">
            <button class="browser-go"><i class="fas fa-arrow-right"></i></button>
          </div>
          <iframe class="browser-iframe" src="${escapeHtml(url)}" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        `;
        
        const iframe = container.querySelector('.browser-iframe');
        const urlInput = container.querySelector('.browser-url');
        
        container.querySelector('.browser-go').addEventListener('click', () => {
          let val = urlInput.value.trim();
          if (!val.startsWith('http://') && !val.startsWith('https://')) val = 'https://' + val;
          iframe.src = val;
        });
        
        container.querySelector('.browser-url').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') container.querySelector('.browser-go').click();
        });
        
        container.querySelector('.browser-refresh').addEventListener('click', () => {
          iframe.src = iframe.src;
        });
        
        container.querySelector('.browser-back').addEventListener('click', () => {
          try { iframe.contentWindow?.history?.back(); } catch(e) {}
        });
        
        container.querySelector('.browser-forward').addEventListener('click', () => {
          try { iframe.contentWindow?.history?.forward(); } catch(e) {}
        });
        
        return container;
      }

      function appendMsg(content, isUser, thinking = null, attachedFiles = null, imageGen = null) {
        const row = document.createElement('div');
        row.className = `message-row ${isUser ? 'user-row' : ''}`;
        if (!isUser) {
          let th = '';
          if (thinking) {
            const thinkId = 'think-' + Date.now();
            th = `<button class="thinking-toggle-btn" onclick="document.getElementById('${thinkId}').classList.toggle('visible')"><i class="fas fa-brain"></i> View thinking</button><div class="thinking-content" id="${thinkId}">${thinking}</div>`;
          }
          
          let extraContent = '';
          if (imageGen) {
            extraContent = `<div class="image-loading"><i class="fas fa-spinner"></i> Generating image...</div>`;
          }
          
          if (content.includes('[BROWSER]')) {
            const url = content.match(/\[BROWSER\](.*?)\[\/BROWSER\]/);
            if (url) {
              const browserContainer = createMiniBrowser(url[1]);
              extraContent += browserContainer.outerHTML;
              content = content.replace(/\[BROWSER\].*?\[\/BROWSER\]/, '🌐 Browser opened');
            }
          }
          
          const html = renderMarkdown(content);
          row.innerHTML = `<div class="message-avatar ai-avatar">⧩</div><div class="message-content">${th}<div class="message-bubble ai-bubble" id="stream-${Date.now()}">${html}${extraContent}</div></div>`;
        } else {
          let fh = '';
          if (attachedFiles?.length) { 
            fh = '<div class="upload-preview">'; 
            attachedFiles.forEach(f => { 
              if (f.type?.startsWith('image/')) fh += `<img src="${f.data}" alt="${f.name}">`; 
              else fh += `<span class="file-tag"><i class="fas fa-file"></i> ${f.name}</span>`; 
            }); 
            fh += '</div>'; 
          }
          const av = googleUser?.picture ? `<img src="${googleUser.picture}" alt="U">` : '<i class="fas fa-user"></i>';
          row.innerHTML = `<div class="message-content"><div class="message-bubble user-bubble">${content}</div>${fh}</div><div class="message-avatar user-avatar">${av}</div>`;
        }
        messagesContainer.appendChild(row);
        if (!isUser) addCodeActions(row);
        scrollToBottom();
      }

      function addCodeActions(container) {
        if (!container) return;
        container.querySelectorAll('.code-block-wrapper').forEach(w => {
          if (w.querySelector('.code-actions')) return;
          const c = w.querySelector('code'); if (!c) return;
          const a = document.createElement('div'); a.className = 'code-actions';
          const cp = document.createElement('button'); cp.innerHTML = '<i class="fas fa-copy"></i>';
          cp.addEventListener('click', () => { navigator.clipboard.writeText(c.textContent).then(() => { cp.innerHTML = '<i class="fas fa-check"></i>'; cp.classList.add('copied'); setTimeout(() => { cp.innerHTML = '<i class="fas fa-copy"></i>'; cp.classList.remove('copied'); }, 2000); }); });
          a.appendChild(cp);
          if (previewEnabled && (c.className.includes('html') || c.textContent.trim().startsWith('<'))) {
            const rb = document.createElement('button'); rb.className = 'run-btn'; rb.innerHTML = '<i class="fas fa-play"></i>';
            rb.addEventListener('click', () => openPreview(c.textContent, 'index.html'));
            a.appendChild(rb);
          }
          w.appendChild(a);
        });
      }

      $('uploadBtn').addEventListener('click', () => fileUploadInput.click());

        const files = Array.from(fileUploadInput.files); if (!files.length) return;

            uploadedFiles.push({ id: Date.now()+Math.random(), name: f.name, type: f.type, data: r.result, size: f.size, content: r.result });

      function finalizeThinkingUI(thinkId, keepContent) {
        const btn = document.getElementById('thinkBtn-' + thinkId);
        const el = document.getElementById(thinkId);
        if (btn) {
          if (keepContent) { btn.innerHTML = '<i class="fas fa-brain"></i> View thinking'; btn.classList.remove('active'); }
          else { btn.remove(); }
        }
        if (el) { el.classList.remove('streaming'); if (!keepContent) el.remove(); }
      }

      function streamText(element, content, thinkingEl = null) {
        let index = 0;
        const chars = content.split('');
        let fullText = '';
        
        function renderCurrent() {
          const rendered = renderMarkdown(fullText);
          element.innerHTML = rendered;
          addCodeActions(element.closest('.message-row'));
          if (thinkingEl && thinkingContent) {
            thinkingEl.textContent = thinkingContent;
            thinkingEl.classList.add('streaming');
          }
          scrollToBottom();
        }
        
        function streamChar() {
          if (streamAborted) {
            fullText = content;
            renderCurrent();
            if (thinkingEl) thinkingEl.classList.remove('streaming');
            addCodeActions(element.closest('.message-row'));
            scrollToBottom();
            return;
          }
          if (index < chars.length) {
            fullText += chars[index];
            index++;
            renderCurrent();
            const delay = 2 + Math.random() * 3;
            setTimeout(streamChar, delay);
          } else {
            renderCurrent();
            if (thinkingEl) thinkingEl.classList.remove('streaming');
            addCodeActions(element.closest('.message-row'));
            scrollToBottom();
          }
        }
        
        streamChar();
      }

      async function handleSend() {
        if (isProcessing) return;
        const text = userInput.value.trim();
        if (!text && !uploadedFiles.length) return;
        
        const providerKey = keys[currentModel.provider];
        if (!providerKey || !providerKey.trim()) {
          alert(`Please add your ${currentModel.provider} API key in Settings first.`);
          settingsModal.classList.remove('hidden');
          return;
        }

        if (!currentChatId) createNewChat();
        if (isLanding) { isLanding = false; messagesContainer.innerHTML = ''; }

        const isImageGen = currentModel.imageGen && (
          text.toLowerCase().includes('generate') || 
          text.toLowerCase().includes('create') || 
          text.toLowerCase().includes('draw') ||
          text.toLowerCase().includes('paint') ||
          text.toLowerCase().includes('image')
        );

        const isBrowse = text.includes('browse') || text.includes('visit') || text.includes('open') || text.includes('go to');
        const urlMatch = text.match(/(https?:\/\/[^\s]+)/);
        
        let uc = text || '';
        if (uploadedFiles.length) {
          const fc = uploadedFiles.map(f => f.type?.startsWith('image/') ? `[Image: ${f.name}]` : `--- ${f.name} ---\n${(f.content||'').substring(0,4000)}\n---`).join('\n\n');
          uc = text ? `${text}\n\n${fc}` : `Analyze:\n${fc}`;
        }
        const dc = text || (uploadedFiles.length ? `📎 ${uploadedFiles.length} file(s)` : '');
        const af = [...uploadedFiles];
        
        currentMessages.push({ role: 'user', content: uc, files: af.length ? af : null });
        appendMsg(dc, true, null, af.length ? af : null);
        userInput.value = ''; 
        userInput.style.height = 'auto';
        uploadedFiles = []; 
        saveCurrentChat();

        const row = document.createElement('div');
        row.className = 'message-row';
        const bubbleId = 'stream-' + Date.now();
        const thinkId = 'think-' + Date.now();
        row.innerHTML = `<div class="message-avatar ai-avatar">⧩</div><div class="message-content">
          <button class="thinking-toggle-btn" id="thinkBtn-${thinkId}" onclick="document.getElementById('${thinkId}').classList.toggle('visible')">
            <i class="fas fa-brain"></i> <span class="typing-indicator"><span></span><span></span><span></span></span> Thinking...
          </button>
          <div class="thinking-content" id="${thinkId}"></div>
          <div class="message-bubble ai-bubble" id="${bubbleId}"></div>
        </div>`;
        messagesContainer.appendChild(row);
        scrollToBottom();

        isProcessing = true; sendBtn.style.display = 'none'; stopBtn.classList.add('visible');
        abortController = new AbortController();
        streamAborted = false;
        activeThinkId = thinkId;
        thinkingContent = '';

        try {
          if (isImageGen && currentModel.imageGen) {
            const imageUrl = await generateImage(text);
            if (imageUrl) {
              const imgHtml = `<img src="${imageUrl}" class="generated-image" alt="Generated image">`;
              currentMessages.push({ role: 'assistant', content: `🎨 Generated image:\n${imgHtml}`, imageGen: true });
              const bubble = document.getElementById(bubbleId);
              if (bubble) {
                bubble.innerHTML = imgHtml;
                scrollToBottom();
              }
              saveCurrentChat();
              isProcessing = false; sendBtn.style.display = 'flex'; stopBtn.classList.remove('visible');
              abortController = null; userInput.focus();
              return;
            }
          }

          if (isBrowse && urlMatch) {
            const url = urlMatch[0];
            const browserContainer = createMiniBrowser(url);
            const msg = `🌐 Browser opened: <a href="${url}" target="_blank">${url}</a>`;
            currentMessages.push({ role: 'assistant', content: msg, browser: true });
            const bubble = document.getElementById(bubbleId);
            if (bubble) {
              bubble.innerHTML = msg + browserContainer.outerHTML;
              scrollToBottom();
            }
            saveCurrentChat();
            isProcessing = false; sendBtn.style.display = 'flex'; stopBtn.classList.remove('visible');
            abortController = null; userInput.focus();
            return;
          }

          if (af.length > 0 && af.some(f => f.type?.startsWith('image/')) && currentModel.vision) {
            const imageFile = af.find(f => f.type?.startsWith('image/'));
            if (imageFile) {
              const analysis = await analyzeImage(imageFile.data, text || 'Describe this image in detail.');
              const msg = `👁️ Vision Analysis:\n\n${analysis}`;
              currentMessages.push({ role: 'assistant', content: msg });
              const bubble = document.getElementById(bubbleId);
              if (bubble) {
                streamText(bubble, msg, document.getElementById(thinkId));
              }
              saveCurrentChat();
              isProcessing = false; sendBtn.style.display = 'flex'; stopBtn.classList.remove('visible');
              abortController = null; userInput.focus();
              return;
            }
          }

          const am = [];
          if (systemPromptEnabled) am.push({ role: 'system', content: 'You are Notal AI, a helpful assistant. Use markdown for formatting. If the user asks to browse a website, respond with [BROWSER]url[/BROWSER].' });
          currentMessages.forEach(m => { if (!m.content?.includes('Welcome')) am.push({ role: m.role, content: m.content?.replace(/<[^>]*>/g, '') || '' }); });
          
          const resp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: currentModel.provider,
              model: currentModel.id,
              messages: am,
              prompt: text,
              imageData: af.find(f => f.type?.startsWith('image/'))?.data || null,
              isImageGen: isImageGen,
              apiKey: keys[currentModel.provider]
            }),
            signal: abortController.signal
          });
          
          if (!resp.ok) {
            const err = await resp.json().catch(()=>({}));
            throw new Error(err.error || `HTTP ${resp.status}`);
          }
          
          const data = await resp.json();
          let content = data.response || 'No response from AI.';
          let thinking = data.thinking || null;

          const thinkEl = document.getElementById(thinkId);
          if (thinking && thinkEl) {
            thinkingContent = thinking;
            thinkEl.textContent = thinking;
            thinkEl.classList.add('streaming');
            const btn = document.getElementById('thinkBtn-' + thinkId);
            if (btn) {
              btn.innerHTML = '<i class="fas fa-brain" style="color:#f59e0b;"></i> 💭 Thinking... <i class="fas fa-chevron-right" style="font-size:0.6rem;"></i>';
              btn.classList.add('active');
            }
          }

          const bubble = document.getElementById(bubbleId);
          if (bubble) {
            streamText(bubble, content, thinkEl);
          }

          setTimeout(() => {
            const btn = document.getElementById('thinkBtn-' + thinkId);
            if (btn) {
              btn.innerHTML = '<i class="fas fa-brain"></i> View thinking';
              btn.classList.remove('active');
            }
            if (thinkEl) thinkEl.classList.remove('streaming');
          }, content.length * 3 + 500);

          currentMessages.push({ role: 'assistant', content, thinking });
          saveCurrentChat();
          
        } catch (err) {
          const bubble = document.getElementById(bubbleId);
          finalizeThinkingUI(thinkId, !!thinkingContent);
          if (bubble) {
            const msg = err.name === 'AbortError' ? '⏹️ Stopped' : `❌ ${err.message}`;
            bubble.innerHTML = msg;
            currentMessages.push({ role: 'assistant', content: msg });
          }
          saveCurrentChat();
        } finally {
          isProcessing = false; 
          sendBtn.style.display = 'flex'; 
          stopBtn.classList.remove('visible');
          abortController = null; 
          activeThinkId = null;
          userInput.focus();
          thinkingContent = '';
        }
      }

      });
      modelTrigger.addEventListener('click', e => { e.stopPropagation(); modelDropdown.classList.toggle('show'); });
      document.addEventListener('click', e => { if (!modelTrigger.contains(e.target) && !modelDropdown.contains(e.target)) modelDropdown.classList.remove('show'); });
      sendBtn.addEventListener('click', handleSend);
      userInput.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); handleSend(); } });
      function autoGrowInput() { userInput.style.height = 'auto'; userInput.style.height = Math.min(userInput.scrollHeight, 144) + 'px'; }
      userInput.addEventListener('input', autoGrowInput);
      document.addEventListener('keydown', e => { if (e.key==='Escape') { if (isProcessing && abortController) abortController.abort(); else { settingsModal.classList.add('hidden'); previewPanel.classList.remove('visible'); signoutDropdown.classList.remove('show'); } } });

      let tx = 0;
      sidebar.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
      sidebar.addEventListener('touchmove', e => { if (e.touches[0].clientX - tx < -60) { closeMobileSidebar(); if(window.innerWidth>=769)closeSidebar(); } });

      window.addEventListener('resize', () => {
        if (window.innerWidth <= 768) { toggleSidebarBtn.style.display = 'none'; if (sidebarOpen) sidebar.classList.remove('closed'); }
        else { if (!sidebarOpen) { toggleSidebarBtn.style.display = 'flex'; sidebar.classList.add('closed'); sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); } else { toggleSidebarBtn.style.display = 'none'; sidebar.classList.remove('closed','open'); sidebarOverlay.classList.remove('active'); } }
      });

      if (localStorage.getItem('notal_sidebar_open') === 'false') { sidebarOpen = false; if (window.innerWidth >= 769) { sidebar.classList.add('closed'); toggleSidebarBtn.style.display = 'flex'; } }

      window.addEventListener('load', () => setTimeout(initGoogleSignIn, 1000));
      loadState();
      userInput.focus();
    })();
  </script>
</body>
</html>
